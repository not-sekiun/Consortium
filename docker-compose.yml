services:
  server:
    build: .
    image: consortium:local
    command: ["server"]
    restart: unless-stopped
    volumes:
      - ./data:/consortium/data
      # Lets agent generators that compile inside a container drive the host's
      # Docker engine. Without it they fail on start with "Docker is not
      # installed or not found on the system path". Remove this line (and the
      # group_add below) if you never build those agents: it grants the container
      # control of the host engine, which is root equivalent on the host.
      - /var/run/docker.sock:/var/run/docker.sock
    # The container runs as non-root, so it needs a supplementary group that can
    # open the mounted socket. Under Docker Desktop the socket is root owned and
    # gid 0 is correct. On a Linux host, pass the host docker group id instead:
    #   DOCKER_GID=$(getent group docker | cut -d: -f3) docker compose up -d
    group_add:
      - "${DOCKER_GID:-0}"
    # environment:
    #   Point agent builds at a separate engine (a docker:dind sidecar, a remote
    #   builder) instead of the mounted socket. The generator inherits the
    #   server's environment, so nothing else needs to change.
    #   - DOCKER_HOST=tcp://dind:2375
    ports:
      - "9999:9999"
      # Listeners bind their own ports inside the container at runtime. Publish
      # the range you intend to create listeners on, otherwise they are only
      # reachable from inside the container.
      # - "8080-8090:8080-8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 9999), 2).close()"
      interval: 2s
      timeout: 3s
      retries: 30
      # The server runs a uv based component dependency sync before it binds, so
      # give it room to finish before failed probes start counting.
      start_period: 30s

  # Not started by `docker compose up`. Run it on demand with:
  #   docker compose run --rm client
  client:
    build: .
    image: consortium:local
    profiles: ["client"]
    command: ["client"]
    volumes:
      - ./data:/consortium/data
    # Share the server's network namespace so the client reaches the API on
    # 127.0.0.1, matching the remote_host/remote_port in the shared
    # data/client/client_config.json that a host run client would also use.
    network_mode: "service:server"
    stdin_open: true
    tty: true
    depends_on:
      server:
        condition: service_healthy
