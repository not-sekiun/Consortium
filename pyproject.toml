[project]
name = "consortium"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.2",
    "fastapi[standard]>=0.124.0",
    "jsonschema>=4.25.1",
    "loguru>=0.7.3",
    "packaging>=25.0",
    "prompt-toolkit>=3.0.52",
    "pyjwt>=2.10.1",
    "rich>=14.2.0",
    "watchdog>=6.0.0",
    "websockets>=15.0.1",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.14.8",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=1.0.0",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (includes unused imports)
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "COM",    # flake8-commas (replaces add-trailing-comma)
]
ignore = ["E501", "COM812"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["consortium"]
